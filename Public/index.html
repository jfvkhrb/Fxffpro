<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraftServer Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
    }
    header {
      padding: 24px;
      background: #182438;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: #1c2a40;
      padding: 24px;
      border-radius: 12px;
    }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 8px;
      background: #38bdf8;
      color: #071525;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>CraftServer</h1>
    <p>Minecraft Server Management Panel</p>
  </header>
  <main>
    <div class="card">
      <h2>Welcome to CraftServer</h2>
      <p>Your panel website is now loading.</p>
      <a href="/api/health">Check Server Status</a>
    </div>
  </main>
</body>
        </html>
